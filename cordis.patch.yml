# DeepSeek Harness native Auto Review bundle.
# Guarded entries keep unknown hosts and disabled roots from aborting Loader.
# Internal children follow actionReview through scoped dependency injection.
- insert:
    - id: auto-review
      name: '@jhckevin/dsh-auto-review/entries/runtime'
      config:
        mode: enforcing
        failureThreshold: 3
        breakerCooldownMs: 60000

    - id: auto-review-llm
      name: '@jhckevin/dsh-auto-review/entries/llm'
      config:
        approvalProtocol: codex-native
        provider: deepseek-official
        model: deepseek-v4-flash
        reasoningEffort: off
        maxInputBytes: 16384
        maxOutputTokens: 2048
        timeoutMs: 90000
        maxAttempts: 3
        retryDelayMs: 250
        transcriptMaxEntries: 12
        transcriptMaxBytes: 32768

    - id: auto-review-settings
      name: '@jhckevin/dsh-auto-review/entries/settings'

    - id: auto-review-audit
      name: '@jhckevin/dsh-auto-review/entries/audit'
      config:
        root: !!js dshHomePath('auto-review/audit')
        fsync: true
        replayMaxBytes: 268435456

    - id: auto-review-policy
      name: '@jhckevin/dsh-auto-review/entries/policy'
      config:
        unknownTool: manual
        allowWorkspaceReads: true
        allowWorkspaceWrites: true
        productionMarkers:
          - production
          - prod
          - live
        sensitiveMarkers:
          - .ssh
          - .gnupg
          - .aws
          - .env

    - id: auto-review-command
      name: '@jhckevin/dsh-auto-review/entries/command'

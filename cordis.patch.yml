# DeepSeek Harness native Auto Review bundle.
# The capability service, reviewer provider and policy consumer remain separate
# rows so profile overlays can replace or disable one role without forking code.
- insert:
    - id: auto-review
      name: '@jhckevin/dsh-auto-review'
      config:
        mode: enforcing
        failureThreshold: 3
        breakerCooldownMs: 60000

    - id: auto-review-llm
      name: '@jhckevin/dsh-auto-review/llm-provider'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
        reasoningEffort: off
        maxInputBytes: 16384
        maxOutputTokens: 2048
        timeoutMs: 90000
        maxAttempts: 3
        retryDelayMs: 250
        transcriptMaxEntries: 12
        transcriptMaxBytes: 32768

    - id: auto-review-settings
      name: '@jhckevin/dsh-auto-review/settings-provider'
      inject: [actionReview, settings]

    - id: auto-review-audit
      name: '@jhckevin/dsh-auto-review/audit-jsonl'
      inject: [actionReview]
      config:
        root: !!js dshHomePath('auto-review/audit')
        fsync: true
        replayMaxBytes: 268435456

    - id: auto-review-policy
      name: '@jhckevin/dsh-auto-review/policy'
      config:
        unknownTool: manual
        allowWorkspaceReads: true
        allowWorkspaceWrites: true
        productionMarkers:
          - production
          - prod
          - live
        sensitiveMarkers:
          - .ssh
          - .gnupg
          - .aws
          - .env

    - id: auto-review-command
      name: '@jhckevin/dsh-auto-review/command'
      inject: [actionReview, commands]
